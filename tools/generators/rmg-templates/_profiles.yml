# Zone profiles that every template source can use (a source's own profiles take precedence).
# A profile lists zone fields; it can extend other profiles with `profile: <name>` or `profile: [a, b]`.
# Fields left out keep their default (see .cursor/rules/rmg.md). Values taken from the vanilla templates.

# Player start zone with its town (S1P2Z2M1)
start:
  start: true
  town: true
  mines: {wood: 1, ore: 1, mercury: 1, crystal: 1, sulfur: 1, gem: 1}
  dwellings: [1, 0, 0, 0, 0, 0, 0]
  upgrades: 40
  treasures: 15
  chests: 5
  shops: 10
  shrines: 10
  luck_morale: 60
  resource_buildings: 80
  treasure_buildings: 10
  treasure_blocks: 10000

# Treasure zone without a town, next to a start zone (S3-5P4Z12B4)
treasure:
  size: 14
  mines: {wood: 1, ore: 1, gold: 1}
  dwellings: [0, 0, 0, 0, 0, 1, 0]
  upgrades: 80
  treasures: 20
  prisons: 1
  shops: 30
  shrines: 30
  treasure_buildings: 30
  treasure_blocks: 15000

# Neutral town zone with rare resources (S3-5P4Z12B4)
town:
  size: 14
  town: true
  town_guard: 10
  mines: {mercury: 1, crystal: 1, sulfur: 1, gem: 1}
  dwellings: [0, 1, 0, 0, 0, 0, 0]
  upgrades: 80
  treasures: 20
  shops: 20
  shrines: 30
  luck_morale: 30
  resource_buildings: 40
  treasure_blocks: 10000

# Rich treasure zone, usually in the middle (a treasure zone with twice the treasure blocks)
rich:
  profile: treasure
  size: 20
  treasure_blocks: 40000

# Open World templates: small start area (wood, ore, an abandoned mine, some treasures)
open_world_home:
  start: true
  town: true
  size: 8
  mines: {wood: 1, ore: 1}
  abandoned_mines: 1
  treasures: 25
  chests: 10
  treasure_blocks: 6000

# Open World templates: the gigantic shared area (one neutral town, every mine, many challenges)
open_world:
  size: 100
  town: true
  town_guard: 40          # town guard power 1000 x 40
  mines: {wood: 2, ore: 2, mercury: 2, crystal: 2, sulfur: 2, gem: 2, gold: 4}
  abandoned_mines: 2
  dwellings: [2, 2, 2, 1, 1, 1, 0]
  upgrades: 150
  treasures: 40
  chests: 30
  prisons: 2
  cartographer: 1
  shops: 100
  shrines: 50
  luck_morale: 60
  resource_buildings: 100
  treasure_buildings: 50
  treasure_blocks: 450000  # each block's guard is 2.5 x its value: bigger blocks, stronger guards
  den_of_thieves: 1
